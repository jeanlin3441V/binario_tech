server {
    listen 8080;
    server_name localhost;

    # EXERCÍCIO 2: Limite no corpo da requisição (2MB)
    client_max_body_size 2M;

    # Redirecionamento para a API Express
    location /api/v1/proxy/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # EXERCÍCIO 1: Resposta direta do Nginx em JSON (Sem Node.js)
    location /status-nginx {
        default_type application/json;
        return 200 '{"status": "OK", "servidor": "Nginx", "mensagem": "Resposta gerada diretamente pelo Nginx sem Node.js"}';
    }
}
